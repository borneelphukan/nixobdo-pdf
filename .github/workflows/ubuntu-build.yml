name: Ubuntu Build & Package

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Tag of GitHub Release to attach assets to (e.g. v0.1.32, leave empty to skip)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ubuntu-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          # Locate libpdfium.so from the extracted archive
          PDFIUM_SO=$(find . -name "libpdfium.so" | head -n 1)
          if [ -n "$PDFIUM_SO" ]; then
            cp "$PDFIUM_SO" libpdfium.so
          else
            echo "Error: libpdfium.so not found in extracted archive" >&2
            exit 1
          fi
          ls -la libpdfium.so

      - name: Build nixobdo-pdf release
        run: cargo build --release

      - name: Build Ubuntu installation packages (.deb and .tar.gz)
        run: |
          mkdir -p dist
          chmod +x packaging/linux/*.sh

          # 1. Build Debian (.deb) package
          ./packaging/linux/build-deb.sh \
            target/release/nixobdo-pdf \
            libpdfium.so \
            "${{ steps.version.outputs.VERSION }}" \
            dist

          # 2. Build portable tarball (.tar.gz) with installer
          TAR_DIR="nixobdo-pdf-${{ steps.version.outputs.VERSION }}-linux-x64"
          mkdir -p "$TAR_DIR/assets/icons"
          cp target/release/nixobdo-pdf "$TAR_DIR/"
          cp libpdfium.so "$TAR_DIR/"
          cp packaging/linux/nixobdo-pdf.desktop "$TAR_DIR/"
          cp packaging/linux/install.sh "$TAR_DIR/"
          cp packaging/linux/uninstall.sh "$TAR_DIR/"
          if [ -f assets/logo.png ]; then
            cp assets/logo.png "$TAR_DIR/assets/"
          fi
          if [ -f assets/icons/logo.svg ]; then
            cp assets/icons/logo.svg "$TAR_DIR/assets/icons/"
          fi

          tar -czf "dist/$TAR_DIR.tar.gz" "$TAR_DIR"
          rm -rf "$TAR_DIR"

          echo "==> Generated packages:"
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nixobdo-pdf-ubuntu-x64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to Release (if specified or tag event)
        if: github.event.inputs.upload_to_release != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.upload_to_release || github.ref_name }}
          files: |
            dist/*.deb
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
