name: Release (Stable)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      COMMIT_SHA: ${{ steps.commit.outputs.SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump patch version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -match 'version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3] + 1
            $newVersion = "$major.$minor.$patch"
            $regex = [regex]'(version\s*=\s*")(\d+\.\d+\.\d+)(")'
            $cargo = $regex.Replace($cargo, "`${1}$newVersion`${3}", 1)
            Set-Content Cargo.toml $cargo -NoNewline
            
            $iss = Get-Content setup.iss -Raw
            $iss = $iss -replace '(AppVersion=)(\d+\.\d+\.\d+)', "`${1}$newVersion"
            Set-Content setup.iss $iss -NoNewline
            
            echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
            Write-Host "Bumped to $newVersion"
          }

      - name: Commit version bump and create PR
        id: commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $branch = "chore/bump-version-${{ steps.version.outputs.VERSION }}"
          git checkout -b $branch
          git add Cargo.toml setup.iss
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          $sha = git rev-parse HEAD
          echo "SHA=$sha" >> $env:GITHUB_OUTPUT
          git push -f -u origin $branch
          gh pr create --title "chore: bump version to ${{ steps.version.outputs.VERSION }}" --body "Automated version bump" --base main --head $branch
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Ignoring gh pr create error (PR likely already exists)"
            exit 0
          }

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Convert Logo to ICO
        run: magick -background none -density 256 assets\icons\logo.svg -define icon:auto-resize="256,128,64,48,32,16" assets\logo.ico

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Download and Extract pdfium
        run: |
          Invoke-WebRequest -Uri https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          tar -xzf pdfium.tgz
          Get-ChildItem -Recurse -Filter pdfium.dll | Copy-Item -Destination .

      - name: Build Installer (Inno Setup)
        run: iscc setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output\nixobdo-pdfSetup.exe
          retention-days: 1

  build-ubuntu:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp $(find . -name "libpdfium.so" | head -n 1) libpdfium.so

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Build Ubuntu packages
        run: |
          mkdir -p dist
          chmod +x packaging/linux/*.sh
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          
          # Debian package
          ./packaging/linux/build-deb.sh target/release/nixobdo-pdf libpdfium.so "$VERSION" dist
          
          # Portable tarball
          TAR_DIR="nixobdo-pdf-${VERSION}-linux-x64"
          mkdir -p "$TAR_DIR/assets/icons"
          cp target/release/nixobdo-pdf libpdfium.so packaging/linux/nixobdo-pdf.desktop packaging/linux/install.sh packaging/linux/uninstall.sh "$TAR_DIR/"
          [ -f assets/logo.png ] && cp assets/logo.png "$TAR_DIR/assets/" || true
          [ -f assets/icons/logo.svg ] && cp assets/icons/logo.svg "$TAR_DIR/assets/icons/" || true
          tar -czf "dist/$TAR_DIR.tar.gz" "$TAR_DIR"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-installers
          path: dist/*
          retention-days: 1

  publish-stable:
    needs: [prepare, build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download Ubuntu Installers
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-installers
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.prepare.outputs.VERSION }}
          name: Release v${{ needs.prepare.outputs.VERSION }}
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
