name: macOS DMG

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable

      - name: Convert Logo to ICNS
        run: magick -background none -density 256 assets/icons/logo.svg -define icon:auto-resize="256,128,64,48,32,16" assets/logo.ico 2>/dev/null || magick -background none -density 256 assets/logo.svg -define icon:auto-resize="256,128,64,48,32,16" assets/logo.icns

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Download and Extract pdfium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-arm64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp $(find . -name "libpdfium.dylib" | head -n 1) libpdfium.dylib

      - name: Build macOS app bundle and DMG
        run: |
          chmod +x packaging/macos/build-app.sh
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          ./packaging/macos/build-app.sh target/release/nixobdo-pdf lib/libpdfium.dylib "$VERSION" dist

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          retention-days: 7