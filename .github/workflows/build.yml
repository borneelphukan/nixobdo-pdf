
name: Build

on:
  push:
    branches: [ "main", "workflow-optimization" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  # Pull requests run the full build matrix as a validation run: the version is
  # not bumped and nothing is published (see the guards below).
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    # Version resolution is cheap; keep it on Linux for PR validation runs.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'windows-latest' }}
    if: "github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'chore: bump version')"
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      # On pull requests no bump commit exists, so fall back to the event SHA.
      COMMIT_SHA: ${{ steps.commit.outputs.SHA || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve next version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch 'version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            Write-Error "Could not read version from Cargo.toml"
            exit 1
          }

          if ($env:EVENT_NAME -eq 'pull_request') {
            # Validation build: never mutate the repo, just reuse the current version.
            $newVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            Write-Host "Pull request build - using current version $newVersion without bumping"
          }
          else {
            $newVersion = "$([int]$Matches[1]).$([int]$Matches[2]).$([int]$Matches[3] + 1)"
            $regex = [regex]'(version\s*=\s*")(\d+\.\d+\.\d+)(")'
            $cargo = $regex.Replace($cargo, "`${1}$newVersion`${3}", 1)
            Set-Content Cargo.toml $cargo -NoNewline

            $iss = Get-Content setup.iss -Raw
            $iss = $iss -replace '(AppVersion=)(\d+\.\d+\.\d+)', "`${1}$newVersion"
            Set-Content setup.iss $iss -NoNewline
            Write-Host "Bumped to $newVersion"
          }

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump and create PR
        id: commit
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $branch = "chore/bump-version-${{ steps.version.outputs.VERSION }}"
          git checkout -b $branch
          git add Cargo.toml setup.iss
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          $sha = git rev-parse HEAD
          echo "SHA=$sha" >> $env:GITHUB_OUTPUT
          git push -f -u origin $branch
          gh pr create --title "chore: bump version to ${{ steps.version.outputs.VERSION }}" --body "Automated version bump" --base main --head $branch
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Ignoring gh pr create error (PR likely already exists)"
            exit 0
          }

  windows_64:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}


      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Convert Logo to ICO
        run: magick -background none -density 256 assets\icons\logo.svg -define icon:auto-resize="256,128,64,48,32,16" assets\logo.ico

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Download and Extract pdfium
        run: |
          Invoke-WebRequest -Uri https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          tar -xzf pdfium.tgz
          Get-ChildItem -Recurse -Filter pdfium.dll | Copy-Item -Destination .

      - name: Build Installer (Inno Setup)
        run: iscc setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output\nixobdo-pdfSetup.exe
          retention-days: 1

  debian-x86_64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp $(find . -name "libpdfium.so" | head -n 1) libpdfium.so

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Build Debian package
        run: |
          mkdir -p dist
          chmod +x packaging/linux/*.sh
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          ./packaging/linux/build-deb.sh target/release/nixobdo-pdf libpdfium.so "$VERSION" dist

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-installer
          path: dist/*
          retention-days: 1

  rpm-x86_64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config rpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp $(find . -name "libpdfium.so" | head -n 1) libpdfium.so

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Build RPM package (Fedora / RHEL / openSUSE)
        run: |
          mkdir -p dist
          chmod +x packaging/rpm/build-rpm.sh
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          ./packaging/rpm/build-rpm.sh target/release/nixobdo-pdf libpdfium.so "$VERSION" dist
          rpm -qpi dist/*.rpm || true
          rpm -qpl dist/*.rpm || true

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-installer
          path: dist/*.rpm
          retention-days: 1

  tarball-x86_64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp $(find . -name "libpdfium.so" | head -n 1) libpdfium.so

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Build tarball
        run: |
          mkdir -p dist
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          
          TAR_DIR="nixobdo-pdf-${VERSION}-linux-x64"
          mkdir -p "$TAR_DIR/assets/icons"
          cp target/release/nixobdo-pdf libpdfium.so packaging/linux/nixobdo-pdf.desktop packaging/linux/install.sh packaging/linux/uninstall.sh "$TAR_DIR/"
          [ -f assets/logo.png ] && cp assets/logo.png "$TAR_DIR/assets/" || true
          [ -f assets/icons/logo.svg ] && cp assets/icons/logo.svg "$TAR_DIR/assets/icons/" || true
          tar -czf "dist/$TAR_DIR.tar.gz" "$TAR_DIR"

      - name: Upload tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-installer
          path: dist/*
          retention-days: 1

  appimage-x86_64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install FUSE dependencies for AppImage
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install FUSE
        run: sudo apt-get install -y libfuse2

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp $(find . -name "libpdfium.so" | head -n 1) libpdfium.so

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse libfuse2

      - name: Build AppImage
        run: |
          mkdir -p dist
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          
          # Create AppDir structure
          mkdir -p "AppImage/nixobdo-pdf-${VERSION}-linux-x86_64"
          cp target/release/nixobdo-pdf AppImage/nixobdo-pdf-${VERSION}-linux-x86_64/
          cp libpdfium.so AppImage/nixobdo-pdf-${VERSION}-linux-x86_64/
          cp packaging/linux/nixobdo-pdf.desktop AppImage/nixobdo-pdf-${VERSION}-linux-x86_64/
          cp packaging/linux/install.sh AppImage/nixobdo-pdf-${VERSION}-linux-x86_64/
          
          # Copy icon file for desktop entry
          cp assets/logo.png AppImage/nixobdo-pdf-${VERSION}-linux-x86_64/nixobdo-pdf.png
          
          # Use appimagetool to create AppImage
          curl -sL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ./appimagetool AppImage/nixobdo-pdf-${VERSION}-linux-x86_64 "dist/nixobdo-pdf-${VERSION}-linux-x86_64.AppImage"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-installer
          path: dist/*
          retention-days: 1

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable

      - name: Build nixobdo-pdf
        run: cargo build --release

      - name: Verify and prepare DMG source
        run: |
          set -e
          echo "Checking build output..."
          ls -la target/release/
          if [ -f target/release/nixobdo-pdf ]; then
            echo "Binary found, copying to dist..."
            mkdir -p dist
            cp target/release/nixobdo-pdf dist/nixobdo-pdf
          else
            echo "ERROR: nixobdo-pdf binary not found in target/release/"
            exit 1
          fi

      - name: Create DMG
        run: |
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          DMG_NAME="nixobdo-pdf-${VERSION}-macos.dmg"
          hdiutil create -volname "nixobdo-pdf" -srcfolder dist -format UDZO -o dist/$DMG_NAME

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          retention-days: 1

  publish-stable:
    needs: [prepare, windows_64, debian-x86_64, rpm-x86_64, tarball-x86_64, appimage-x86_64, build-macos]
    # Validation runs triggered by pull requests never publish a release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download Debian Installer
        uses: actions/download-artifact@v4
        with:
          name: debian-installer
          path: dist/

      - name: Download RPM Installer
        uses: actions/download-artifact@v4
        with:
          name: rpm-installer
          path: dist/

      - name: Download tarball Installer
        uses: actions/download-artifact@v4
        with:
          name: tarball-installer
          path: dist/

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-installer
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.prepare.outputs.VERSION }}
          name: Release v${{ needs.prepare.outputs.VERSION }}
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}