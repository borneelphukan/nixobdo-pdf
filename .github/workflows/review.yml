name: Review

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  website-build:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &setup-pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: website/package.json

      - &setup-node
        name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - &install-dependencies
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  website-lint:
    name: Lint website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install-dependencies

      - name: Lint
        run: pnpm lint

  rust-fmt:
    name: Format rust code
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - &setup-rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Format check
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Clippy rust code
    runs-on: ubuntu-latest
    # Advisory until the existing warning backlog is cleared.
    continue-on-error: true
    steps:
      - *checkout
      - &install-linux-deps
        name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - *setup-rust
      - &cache-rust
        name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    name: Test rust code
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-linux-deps
      - *setup-rust
      - *cache-rust

      - name: Test
        run: cargo test --locked --all-targets

  rust-audit:
    name: Audit rust dependencies
    runs-on: ubuntu-latest
    # Advisory for now; make blocking once the dependency tree is clean.
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - *checkout
      - *setup-rust

      - name: Audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust-build:
    name: Build rust code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - *checkout
      - *install-linux-deps
      - *setup-rust
      - *cache-rust

      - name: Build
        run: cargo build --locked
