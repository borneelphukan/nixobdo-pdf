name: Nightly Release

on:
  push:
    branches: ["dev"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Convert logo to ICO
        run: magick -background none -density 256 assets\icons\logo.svg -define icon:auto-resize="256,128,64,48,32,16" assets\logo.ico

      - name: Build nixobdo-pdf
        run: cargo build --release --locked

      - name: Download and extract PDFium
        run: |
          Invoke-WebRequest -Uri https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          tar -xzf pdfium.tgz
          Get-ChildItem -Recurse -Filter pdfium.dll | Copy-Item -Destination .

      - name: Build installer (Inno Setup)
        run: iscc setup.iss

      - name: Rename installer for dev build
        shell: pwsh
        run: Rename-Item -Path "Output\nixobdo-pdfSetup.exe" -NewName "nixobdo-pdf-dev-${{ github.run_number }}.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: Output\nixobdo-pdf-dev-${{ github.run_number }}.exe
          retention-days: 1

  build-ubuntu:
    name: Build Ubuntu packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp "$(find . -name 'libpdfium.so' | head -n 1)" libpdfium.so

      - name: Build nixobdo-pdf
        run: cargo build --release --locked

      - name: Build Ubuntu packages
        run: |
          mkdir -p dist
          chmod +x packaging/linux/*.sh
          VERSION="${{ steps.version.outputs.VERSION }}"

          ./packaging/linux/build-deb.sh target/release/nixobdo-pdf libpdfium.so "$VERSION" dist

          TAR_DIR="nixobdo-pdf-${VERSION}-linux-x64"
          mkdir -p "$TAR_DIR/assets/icons"
          cp target/release/nixobdo-pdf libpdfium.so packaging/linux/nixobdo-pdf.desktop packaging/linux/install.sh packaging/linux/uninstall.sh "$TAR_DIR/"
          [ -f assets/logo.png ] && cp assets/logo.png "$TAR_DIR/assets/" || true
          [ -f assets/icons/logo.svg ] && cp assets/icons/logo.svg "$TAR_DIR/assets/icons/" || true
          tar -czf "dist/$TAR_DIR.tar.gz" "$TAR_DIR"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-installers
          path: |
            dist/*.deb
            dist/*.tar.gz
          retention-days: 1

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and extract PDFium
        run: |
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-univ.tgz -o pdfium.tgz
          tar -xzf pdfium.tgz
          cp "$(find . -name 'libpdfium.dylib' | head -n 1)" libpdfium.dylib

      - name: Build nixobdo-pdf
        run: cargo build --release --locked

      - name: Build app bundle and DMG
        run: |
          chmod +x packaging/macos/build-app.sh
          ./packaging/macos/build-app.sh \
            target/release/nixobdo-pdf \
            libpdfium.dylib \
            "${{ steps.version.outputs.VERSION }}" \
            dist \
            "$(uname -m)"
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -n 1)
          mv "$DMG" "dist/nixobdo-pdf-dev-${{ github.run_number }}-macos-$(uname -m).dmg"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: dist/*.dmg
          retention-days: 1

  publish-nightly:
    name: Publish dev pre-release
    needs: [build-windows, build-ubuntu, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "DEV_VERSION=$VERSION-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/

      - name: Download Ubuntu packages
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-installers
          path: dist/

      - name: Download macOS app
        uses: actions/download-artifact@v8
        with:
          name: macos-installers
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Delete previous rolling dev release
        run: gh release delete dev-release --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dev pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: dev-release
          target_commitish: ${{ github.sha }}
          name: "Dev Build (latest)"
          body: |
            ⚠️ **Unstable development build — not for production use.**

            **Version:** `${{ steps.version.outputs.DEV_VERSION }}`
            **Commit:** `${{ github.sha }}`
            **Branch:** `dev`

            This release is automatically overwritten on every push to `dev`.
            For the latest stable release, see the [Releases page](../../releases/latest).
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
