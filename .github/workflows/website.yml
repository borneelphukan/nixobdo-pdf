name: Website

# The release workflow builds the site for GitHub Pages, but it also builds
# every desktop package. Keeping landing-page-only changes in this small
# workflow avoids a full Linux/Windows/macOS packaging matrix for a CSS tweak.

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
