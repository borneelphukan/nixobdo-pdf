version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    ignore:
      # The ref of this action is a Rust toolchain version, not an action
      # release, so Dependabot "bumps" it to tags that have no matching rustup
      # download (1.120.0 does not exist) and every build job dies at toolchain
      # install. Pin it deliberately in rust-toolchain.toml and each workflow.
      - dependency-name: dtolnay/rust-toolchain
        versions: ["*"]
    groups:
      github-actions:
        patterns:
          - "*"
