[package]
name = "nixobdo-pdf"
version = "0.1.32"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg", "image"] }
pdfium-render = { version = "0.8.37", features = ["image"] }
rfd = "0.17.2"
webbrowser = "1.2.4"
docx-rs = "0.4.22"
zip = "8.6.0"
ureq = "3.4.0"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bincode = "1.3.3"
chrono = "0.4.45"

image = "0.25.5"


[build-dependencies]
winres = "0.1.12"
